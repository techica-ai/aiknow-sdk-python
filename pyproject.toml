[project]
name = "aiknow-sdk-python"
version = "0.1.0"
description = "Public Python SDK for the AIKNOW platform."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "aiknow-contracts"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiknow"]

[tool.uv.sources]
aiknow-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[[tool.uv.index]]
name = "github-packages"
url = "https://pypi.pkg.github.com/techica-ai/"
